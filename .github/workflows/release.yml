name: Release Foundry module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag and package version
        run: |
          MODULE_VERSION=$(node -p "require('./apps/foundry-module/module.json').version")
          test "v${MODULE_VERSION}" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:module
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "artifacts/foundry-mcp-bridge-${GITHUB_REF_NAME#v}.zip" --generate-notes
