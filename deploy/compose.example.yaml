services:
  foundry-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Chromium's sandbox is often unusable in containers; opt in explicitly here.
      FOUNDRY_HEADLESS_CHROMIUM_NO_SANDBOX: ${FOUNDRY_HEADLESS_CHROMIUM_NO_SANDBOX:-true}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1gb"
    ports:
      - "127.0.0.1:3210:3210"
    volumes:
      - ../data:/app/data
      - ../agent_rules.md:/app/agent_rules.md:ro
