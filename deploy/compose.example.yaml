services:
  foundry-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3210:3210"
    volumes:
      - ../data:/app/data
